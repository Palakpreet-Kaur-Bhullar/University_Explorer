<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎓 University Explorer</h1>
    </header>

    <section class="search-section">
        <div class="search-controls">
            <input type="text" id="searchInput" placeholder="Type to search..." oninput="debounceSearch()">
            
            <select id="countrySelect" onchange="handleSearch()">
                <option value="">All Countries</option>
                <option value="India">India</option>
                <option value="United States">United States</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
            </select>

            <select id="sortSelect" onchange="applyFiltersAndSort()">
                <option value="asc">Name (A-Z)</option>
                <option value="desc">Name (Z-A)</option>
            </select>
        </div>

        <div class="button-group">
            <button class="btn-secondary" id="favToggle" onclick="toggleViewFavorites()">View Favorites</button>
            <button class="btn-icon" title="Clear All" onclick="clearAllFilters()">🧹</button>
            <button class="btn-icon" id="themeToggle" onclick="toggleTheme()">☀️</button>
        </div>
    </section>

    <div id="loader" class="hidden">
        <div class="spinner"></div>
    </div>

    <main id="results"></main>

    <script src="script.js"></script>
</body>
</html>
